name: Docker

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: zerostwo/i-remember.fr

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Validate deployment files
        shell: bash
        run: |
          set -euo pipefail
          sh -n docker/single-entrypoint.sh
          sh -n docker/healthcheck.sh
          sh -n docker/backup.sh
          sh -n docker/restore.sh
          bash -n docker/ci-smoke.sh
          TAG=sha-000000000000 docker compose config --quiet

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: |
          pnpm lint
          pnpm typecheck
          pnpm build
          pnpm test

      - name: Reject high or critical production advisories
        run: pnpm audit --prod --audit-level=high

      - name: Build pull-request image
        if: github.event_name == 'pull_request'
        run: docker build --tag i-remember:pull-request-smoke .

      - name: Verify pull-request container lifecycle
        if: github.event_name == 'pull_request'
        run: bash docker/ci-smoke.sh i-remember:pull-request-smoke

  publish:
    needs: verify
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve Docker tags
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "Release tag is not valid SemVer: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            if [[ "${version}" != "${package_version}" ]]; then
              echo "Release tag ${version} does not match package.json ${package_version}" >&2
              exit 1
            fi
            primary="sha-${GITHUB_SHA::12}"
            tags=("${primary}" "${version}" "latest")
          else
            primary="sha-${GITHUB_SHA::12}"
            tags=("${primary}" "latest")
          fi
          {
            echo "primary=${primary}"
            echo "tags<<EOF"
            printf "%s\n" "${tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          echo "TAG=${primary}" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        run: docker build --tag "${DOCKERHUB_IMAGE}:${TAG}" .

      - name: Verify fresh volume, restart, backup, and restore
        run: bash docker/ci-smoke.sh "${DOCKERHUB_IMAGE}:${TAG}"

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: zerostwo
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        shell: bash
        env:
          PRIMARY_TAG: ${{ steps.version.outputs.primary }}
          TAGS: ${{ steps.version.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] || continue
            if [[ "${tag}" != "${PRIMARY_TAG}" ]]; then
              docker tag "${DOCKERHUB_IMAGE}:${PRIMARY_TAG}" "${DOCKERHUB_IMAGE}:${tag}"
            fi
            docker push "${DOCKERHUB_IMAGE}:${tag}"
          done <<< "${TAGS}"
